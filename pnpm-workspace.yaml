packages:
  - apps/frontend
  - apps/backend
  - packages/typescript-config

# Single source of truth for dependency versions genuinely shared across
# workspace packages at the exact same version - not for deps that are
# intentionally different per app (e.g. react/styled-components run
# different major/pinning per app on purpose; see docs/MIGRATION.md and
# openspec/changes/adopt-typescript-backend/design.md for why).
catalog:
  typescript: 5.9.3
  '@types/node': 22.20.1
  '@strapi/typescript-utils': 5.52.2

allowBuilds:
  '@fortawesome/fontawesome-common-types': true
  '@fortawesome/fontawesome-free': true
  '@fortawesome/fontawesome-svg-core': true
  '@fortawesome/free-brands-svg-icons': true
  '@fortawesome/free-solid-svg-icons': true
  '@strapi/strapi': true
  '@swc/core': true
  better-sqlite3: true
  core-js-pure: true
  esbuild: true
  sharp: true
  sqlite3: false
  styled-components: true
  unrs-resolver: true

blockExoticSubdeps: true

# Fail if a package's trust level has decreased (pnpm 10.21+)
trustPolicy: no-downgrade
# Ignore the check for packages published more than 30 days ago (pnpm 10.27+)
# Useful for older packages that pre-date provenance support
trustPolicyIgnoreAfter: 43200 # minutes (30 days)

minimumReleaseAge: 10080 # 7 days (in minutes)
# First-party Strapi packages are trusted immediately after publish (official
# framework releases, not arbitrary third-party deps) - exempt from the age gate.
minimumReleaseAgeExclude:
  - '@strapi/*'

# Defensive documentation: already pnpm 11.x's defaults, but pinned explicitly
# so a future pnpm major or a contributor's global ~/.npmrc can't silently
# change install behavior. Must be camelCase - the kebab-case .npmrc-style
# spelling is silently ignored here.
autoInstallPeers: true
strictPeerDependencies: false
